<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신고센터 — 선영국가</title>
<link rel="stylesheet" href="../style.css">
<style>
.report-wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

.report-form-card {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}
.report-form-card h3 {
  font-size: 15px; font-weight: 700;
  color: var(--accent2); margin-bottom: 14px;
}

.section-title {
  font-size: 12px; font-weight: 700;
  color: var(--text-dim); letter-spacing: 2px;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--navy-light), transparent);
}

.report-hist-item {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 12px;
}
.report-hist-content { flex: 1; }
.report-hist-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.report-hist-meta { font-size: 11px; color: var(--text-dim); }
.report-hist-result {
  font-size: 12px; color: var(--text-dim);
  margin-top: 6px; line-height: 1.5;
}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">🚨 신고센터<span>선영국가</span></div>
</div>

<div class="report-wrap has-bottom-nav">
  <!-- 신고 접수 폼 -->
  <div class="report-form-card">
    <h3>📋 신고 접수하기</h3>
    <div class="input-group">
      <label>신고 유형</label>
      <select id="reportType">
        <option value="">-- 유형 선택 --</option>
        <option value="매점 물품 도난">매점 물품 도난</option>
        <option value="사행성 도박">사행성 도박</option>
        <option value="근무 태만">근무 태만</option>
        <option value="규칙 위반">규칙 위반</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="input-group">
      <label>신고 내용</label>
      <textarea id="reportContent" placeholder="구체적인 내용을 작성해주세요.&#10;신고자 이름은 담임선생님(마스터)만 볼 수 있습니다."></textarea>
    </div>
    <button class="btn btn-danger btn-full" onclick="doReport()">🚨 신고 접수하기</button>
    <div style="margin-top:10px;font-size:11px;color:var(--text-dim);text-align:center;">
      신고자 이름은 담임선생님(마스터)만 확인할 수 있습니다
    </div>
  </div>

  <!-- 신고 현황 -->
  <div class="section-title">📋 신고 현황 (전체 공개)</div>
  <div class="spinner" id="report-spinner"></div>
  <div id="reportList"></div>
  <div class="empty-state" id="report-empty" style="display:none;">
    <div class="emoji">✅</div>
    접수된 신고가 없어요
  </div>
</div>

<!-- 하단 네비 -->
<nav class="bottom-nav">
  <a href="me.html"><span class="icon">👤</span>내정보</a>
  <a href="report.html" class="active"><span class="icon">🚨</span>신고</a>
  <a href="#" onclick="openStock()"><span class="icon">📈</span>주식</a>
  <a href="kiosk.html"><span class="icon">📊</span>현황판</a>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
  import { requireLogin } from "../auth.js";
  import { addReport, getPublicReports, getStudentByName } from "../db.js";

  const session = requireLogin();
  if (!session) throw new Error("로그인 필요");

  // 주식키 로드
  getStudentByName(session.name).then(s => { window._stockKey = s?.stockKey || ""; });

  const statusBadge = {
    "접수됨": `<span class="badge badge-gold">접수됨</span>`,
    "조사중": `<span class="badge badge-blue">조사중</span>`,
    "처리완료": `<span class="badge badge-green">처리완료</span>`,
  };

  async function loadReports() {
    document.getElementById("report-spinner").style.display = "block";
    const reports = await getPublicReports();
    document.getElementById("report-spinner").style.display = "none";

    if (reports.length === 0) {
      document.getElementById("report-empty").style.display = "block";
      return;
    }

    document.getElementById("reportList").innerHTML = reports.map(r => {
      const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString("ko-KR", { month:"numeric", day:"numeric" }) : "";
      return `
        <div class="report-hist-item">
          <div class="report-hist-content">
            <div class="report-hist-title">${r.type}</div>
            <div class="report-hist-meta">${date} · ${statusBadge[r.status] || r.status}</div>
            ${r.content ? `<div class="report-hist-result">${r.content}</div>` : ""}
            ${r.result ? `<div class="report-hist-result" style="color:var(--accent3);">처리 결과: ${r.result}</div>` : ""}
          </div>
        </div>`;
    }).join("");
  }

  window.doReport = async function() {
    const type = document.getElementById("reportType").value;
    const content = document.getElementById("reportContent").value.trim();
    if (!type) return showToast("신고 유형을 선택해주세요", true);
    if (!content) return showToast("신고 내용을 입력해주세요", true);

    const btn = event.target;
    btn.disabled = true;
    btn.textContent = "접수 중...";

    try {
      await addReport(session.name, type, content);
      showToast("🚨 신고가 접수됐습니다!");
      document.getElementById("reportType").value = "";
      document.getElementById("reportContent").value = "";
      loadReports();
    } catch(e) {
      showToast("오류가 발생했어요", true);
    } finally {
      btn.disabled = false;
      btn.textContent = "🚨 신고 접수하기";
    }
  };

  window.openStock = function() {
    if (window._stockKey) {
      window.open(`https://sub-teacher.com/API/stock/student.html?key=${window._stockKey}`, "_blank");
    } else {
      showToast("선생님께 반짝모의투자 등록을 부탁하세요 📈", true);
    }
  };

  function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2500);
  }

  loadReports();
</script>
</body>
</html>

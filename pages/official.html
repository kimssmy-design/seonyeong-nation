<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공직자 패널 — 선영국가</title>
<link rel="stylesheet" href="../style.css">
<style>
.official-wrap { max-width: 520px; margin: 0 auto; padding: 16px; }

.official-profile {
  background: linear-gradient(135deg, var(--navy-mid), var(--navy-light));
  border: 1px solid var(--gold);
  border-radius: 16px;
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
}
.official-badge { font-size: 36px; }
.official-name { font-size: 16px; font-weight: 900; }
.official-role { font-size: 12px; color: var(--gold); margin-top: 2px; }

/* 학생 체크 리스트 */
.student-check-list { display: flex; flex-direction: column; gap: 6px; }
.student-check-item {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
}
.sname { flex: 1; font-size: 14px; font-weight: 700; }
.samount { font-family: 'Gmarket Sans', sans-serif; font-size: 13px; color: var(--gold); }

/* 섹션 타이틀 */
.section-title {
  font-size: 12px; font-weight: 700; color: var(--text-dim);
  letter-spacing: 2px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--navy-light), transparent);
}
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">🏛️ 공직자 패널<span id="nationName">선영국가</span></div>
  <button class="btn btn-outline btn-sm" onclick="doLogout()">로그아웃</button>
</div>

<div class="official-wrap has-bottom-nav">
  <!-- 프로필 -->
  <div class="official-profile">
    <div class="official-badge" id="roleEmoji">🏛️</div>
    <div>
      <div class="official-name" id="officialName">로딩중...</div>
      <div class="official-role" id="officialRole"></div>
    </div>
  </div>

  <!-- 탭 (역할별로 동적 생성) -->
  <div class="tab-bar" id="officialTabBar" style="overflow-x:auto;"></div>

  <!-- 패널 영역 -->
  <div id="officialPanels"></div>
</div>

<!-- 하단 네비 -->
<nav class="bottom-nav">
  <a href="me.html"><span class="icon">👤</span>내정보</a>
  <a href="report.html"><span class="icon">🚨</span>신고</a>
  <a href="#" onclick="openStock()"><span class="icon">📈</span>주식</a>
  <a href="kiosk.html"><span class="icon">📊</span>현황판</a>
</nav>

<div class="toast" id="toast"></div>

<script type="module">
  import { requireLogin, clearSession, isOfficial } from "../auth.js";
  import {
    getStudentByName, getAllStudents, getNationConfig,
    addTransaction, getTransactions, getFines, payFine,
    getNotices, addNotice,
    getAllReports, updateReport, issueFine,
    addReport
  } from "../db.js";

  const session = requireLogin();
  if (!session) throw new Error("로그인 필요");

  // 공직자 아닌 경우 내 정보로 이동
  if (!isOfficial(session.role)) {
    window.location.href = "me.html";
  }

  const { name, role } = session;

  const roleEmojis = {
    "국회의장":"👑", "감찰관":"🔍", "은행원":"🏦",
    "세금징수원":"💼", "매점지기":"🛒", "주식중개인":"📈",
    "검사":"⚖️", "기자":"📰", "청소원":"🧹"
  };

  // 역할별 탭 구성
  const roleTabs = {
    "은행원": [
      { id: "give", label: "💰 지급처리" },
      { id: "log", label: "📋 처리기록" },
    ],
    "세금징수원": [
      { id: "tax", label: "🏛️ 세금징수" },
      { id: "fine-manage", label: "📄 고지서 관리" },
    ],
    "매점지기": [
      { id: "shop", label: "🛒 매점 운영" },
      { id: "log", label: "📋 판매기록" },
    ],
    "기자": [
      { id: "notice-write", label: "📢 공지 작성" },
    ],
    "검사": [
      { id: "report-manage", label: "🚨 신고 관리" },
      { id: "fine-issue", label: "📄 고지서 발행" },
    ],
    "주식중개인": [
      { id: "stock", label: "📈 주식 현황" },
    ],
    "국회의장": [
      { id: "lottery", label: "🎟️ 로또 뽑기" },
      { id: "notice-write", label: "📢 공지 작성" },
    ],
    "감찰관": [
      { id: "event", label: "🎯 이벤트 보너스" },
      { id: "report-manage", label: "🚨 신고 확인" },
    ],
    "청소원": [
      { id: "log", label: "📋 내 기록" },
    ],
  };

  const tabs = roleTabs[role] || [{ id: "log", label: "📋 내 기록" }];

  async function init() {
    const config = await getNationConfig();
    if (config?.name) document.getElementById("nationName").textContent = config.name;

    document.getElementById("officialName").textContent = name;
    document.getElementById("officialRole").textContent = `💼 ${role}`;
    document.getElementById("roleEmoji").textContent = roleEmojis[role] || "🏛️";
    const student = await getStudentByName(name);
    window._stockKey = student?.stockKey || "";

    // 탭 생성
    document.getElementById("officialTabBar").innerHTML = tabs.map((t, i) =>
      `<button class="tab-btn ${i===0?"active":""}" onclick="switchTab('${t.id}', this)">${t.label}</button>`
    ).join("");

    // 첫 번째 패널 로드
    renderPanel(tabs[0].id);
  }

  window.switchTab = function(panelId, btn) {
    document.querySelectorAll(".tab-btn").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    renderPanel(panelId);
  };

  async function renderPanel(panelId) {
    const container = document.getElementById("officialPanels");
    container.innerHTML = `<div class="spinner"></div>`;

    switch(panelId) {
      case "give": container.innerHTML = await renderGive(); break;
      case "tax": container.innerHTML = await renderTax(); break;
      case "fine-manage": container.innerHTML = await renderFineManage(); break;
      case "fine-issue": container.innerHTML = renderFineIssue(); break;
      case "shop": container.innerHTML = await renderShop(); break;
      case "notice-write": container.innerHTML = renderNoticeWrite(); break;
      case "report-manage": container.innerHTML = await renderReportManage(); break;
      case "event": container.innerHTML = renderEvent(); break;
      case "lottery": container.innerHTML = await renderLottery(); break;
      case "stock": container.innerHTML = renderStock(); break;
      case "log": container.innerHTML = await renderLog(); break;
      default: container.innerHTML = `<div class="empty-state"><div class="emoji">🏛️</div>준비 중이에요</div>`;
    }
    attachHandlers(panelId);
  }

  // ── 은행원: 지급처리 ──
  async function renderGive() {
    const students = await getAllStudents();
    const opts = students.map(s => `<option value="${s.name}">${s.name} (${(s.balance||0).toLocaleString()}원)</option>`).join("");
    return `
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;">💰 칭찬쿠폰 / 지급 처리</div>
        <div class="input-group"><label>대상 학생</label>
          <select id="give-target"><option value="__all__">전체 학생 (주급)</option>${opts}</select>
        </div>
        <div class="input-group"><label>지급 유형</label>
          <select id="give-type">
            <option value="칭찬쿠폰">칭찬쿠폰 (+1,000원)</option>
            <option value="주급">주급 (역할별 수동 입력)</option>
            <option value="이벤트">이벤트 보너스</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="input-group"><label>금액 (원)</label>
          <input type="number" id="give-amount" value="1000" step="500" min="0">
        </div>
        <div class="input-group"><label>메모</label>
          <input type="text" id="give-memo" placeholder="예: 5월 3주차 칭찬쿠폰">
        </div>
        <button class="btn btn-gold btn-full" id="give-btn">지급 처리하기</button>
      </div>`;
  }

  // ── 세금징수원: 세금징수 ──
  async function renderTax() {
    const students = await getAllStudents();
    const taxMap = { "국회의장":1000,"감찰관":1000,"은행원":1000,"세금징수원":1000,
      "검사":500,"매점지기":500,"주식중개인":500,"기자":500,"청소원":500,"국민":500 };
    const rows = students.map(s => {
      const tax = taxMap[s.role] || 500;
      return `
        <div class="student-check-item">
          <div class="sname">${s.name}</div>
          <div><span class="badge badge-blue">${s.role}</span></div>
          <div class="samount">${tax.toLocaleString()}원</div>
          <button class="btn btn-gold btn-sm tax-btn" data-name="${s.name}" data-tax="${tax}">징수</button>
        </div>`;
    }).join("");
    return `
      <div class="section-title">이번 주 세금 징수</div>
      <div class="student-check-list">${rows}</div>`;
  }

  // ── 세금징수원: 고지서 관리 ──
  async function renderFineManage() {
    const students = await getAllStudents();
    let html = "";
    for (const s of students) {
      const fines = await getFines(s.name);
      const unpaid = fines.filter(f => !f.paid);
      if (unpaid.length > 0) {
        unpaid.forEach(f => {
          html += `
            <div class="card" style="margin-bottom:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <div style="font-weight:700;">${s.name}</div>
                <div style="font-family:'Gmarket Sans';color:var(--accent2);font-size:16px;">${f.amount.toLocaleString()}원</div>
              </div>
              <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">사유: ${f.reason}</div>
              <button class="btn btn-gold btn-sm pay-fine-btn" data-fineid="${f.id}" data-name="${s.name}" data-amount="${f.amount}">납부 처리</button>
            </div>`;
        });
      }
    }
    if (!html) html = `<div class="empty-state"><div class="emoji">✅</div>미납 고지서가 없어요</div>`;
    return `<div class="section-title">미납 고지서 목록</div>${html}`;
  }

  // ── 검사: 고지서 발행 ──
  function renderFineIssue() {
    return `
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;">📄 벌금 고지서 발행</div>
        <div class="input-group"><label>대상 이름</label>
          <input type="text" id="fine-target" placeholder="학생 이름 입력">
        </div>
        <div class="input-group"><label>벌금 금액 (원)</label>
          <input type="number" id="fine-amount" value="1000" step="500" min="0">
        </div>
        <div class="input-group"><label>사유</label>
          <input type="text" id="fine-reason" placeholder="예: 매점 물품 무단 취득">
        </div>
        <button class="btn btn-danger btn-full" id="fine-issue-btn">고지서 발행하기</button>
      </div>`;
  }

  // ── 매점지기: 매점 운영 ──
  async function renderShop() {
    const config = await getNationConfig();
    const isOpen = config?.shopOpen;
    return `
      <div class="card" style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:14px;font-weight:700;">매점 상태</div>
            <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">${isOpen ? "🟢 현재 영업중" : "🔒 현재 닫힘"}</div>
          </div>
          <button class="btn ${isOpen ? "btn-danger" : "btn-gold"}" id="shop-toggle-btn">
            ${isOpen ? "매점 닫기" : "매점 열기"}
          </button>
        </div>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;">🛒 판매 기록</div>
        <div class="input-group"><label>구매 학생</label>
          <input type="text" id="shop-buyer" placeholder="학생 이름 입력">
        </div>
        <div class="input-group"><label>금액 (원)</label>
          <input type="number" id="shop-amount" value="1000" step="500" min="0">
        </div>
        <div class="input-group"><label>품목</label>
          <input type="text" id="shop-item" placeholder="예: 새우깡">
        </div>
        <button class="btn btn-gold btn-full" id="shop-sell-btn">판매 처리</button>
      </div>`;
  }

  // ── 기자/국회의장: 공지 작성 ──
  function renderNoticeWrite() {
    return `
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;">📢 공지 작성</div>
        <div class="input-group"><label>제목</label>
          <input type="text" id="notice-title" placeholder="공지 제목">
        </div>
        <div class="input-group"><label>내용</label>
          <textarea id="notice-content" placeholder="공지 내용을 입력하세요"></textarea>
        </div>
        <button class="btn btn-gold btn-full" id="notice-submit-btn">공지 등록하기</button>
      </div>`;
  }

  // ── 검사/감찰관: 신고 관리 ──
  async function renderReportManage() {
    const reports = await getAllReports();
    if (reports.length === 0) return `<div class="empty-state"><div class="emoji">✅</div>접수된 신고가 없어요</div>`;
    const statusBadge = {
      "접수됨":`<span class="badge badge-gold">접수됨</span>`,
      "조사중":`<span class="badge badge-blue">조사중</span>`,
      "처리완료":`<span class="badge badge-green">처리완료</span>`,
    };
    return reports.map(r => {
      const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"}) : "";
      return `
        <div class="card" style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <div style="font-weight:700;">${r.type}</div>
            ${statusBadge[r.status]||r.status}
          </div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">${date} · ${r.content}</div>
          ${r.result ? `<div style="font-size:12px;color:var(--accent3);margin-bottom:8px;">처리결과: ${r.result}</div>` : ""}
          <div style="display:flex;gap:8px;">
            <select class="report-status-sel" data-id="${r.id}" style="background:var(--navy-mid);border:1px solid var(--navy-light);border-radius:6px;padding:6px 8px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;">
              <option ${r.status==="접수됨"?"selected":""}>접수됨</option>
              <option ${r.status==="조사중"?"selected":""}>조사중</option>
              <option ${r.status==="처리완료"?"selected":""}>처리완료</option>
            </select>
            <button class="btn btn-gold btn-sm report-update-btn" data-id="${r.id}">저장</button>
          </div>
        </div>`;
    }).join("");
  }

  // ── 감찰관: 이벤트 보너스 ──
  function renderEvent() {
    return `
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;">🎯 이벤트 보너스 지급</div>
        <div class="input-group"><label>대상 학생</label>
          <input type="text" id="event-target" placeholder="학생 이름 입력">
        </div>
        <div class="input-group"><label>보너스 금액 (원)</label>
          <input type="number" id="event-amount" value="1000" step="500" min="0">
        </div>
        <div class="input-group"><label>이벤트 이름</label>
          <input type="text" id="event-name" placeholder="예: 쪽지찾기 1등">
        </div>
        <button class="btn btn-gold btn-full" id="event-btn">보너스 지급하기</button>
      </div>`;
  }

  // ── 국회의장: 로또 뽑기 ──
  async function renderLottery() {
    const students = await getAllStudents();
    const names = students.map(s => s.name);
    return `
      <div class="card" style="margin-bottom:14px;text-align:center;">
        <div style="font-size:14px;font-weight:700;margin-bottom:16px;">🎟️ 이번 주 로또 당첨자 뽑기</div>
        <div style="font-size:48px;margin-bottom:12px;" id="lottery-result">?</div>
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;" id="lottery-sub">버튼을 눌러 당첨자를 뽑으세요!</div>
        <button class="btn btn-gold btn-full" id="lottery-btn" data-names='${JSON.stringify(names)}'>🎰 당첨자 뽑기!</button>
      </div>
      <div class="card">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;">💰 당첨금 지급</div>
        <div class="input-group"><label>당첨자 이름</label>
          <input type="text" id="lottery-winner" placeholder="뽑기 후 자동 입력됩니다">
        </div>
        <div class="input-group"><label>당첨금 (원)</label>
          <input type="number" id="lottery-prize" value="0" step="500">
        </div>
        <button class="btn btn-gold btn-full" id="lottery-give-btn">당첨금 지급하기</button>
      </div>`;
  }

  // ── 주식중개인: 주식 ──
  function renderStock() {
    return `
      <div class="card" style="text-align:center;padding:30px;">
        <div style="font-size:48px;margin-bottom:16px;">📈</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;">반짝 모의투자</div>
        <div style="font-size:13px;color:var(--text-dim);margin-bottom:20px;">외부 주식 앱으로 이동합니다</div>
        <button class="btn btn-gold" onclick="openStock()">주식 앱 열기 →</button>
      </div>`;
  }

  // ── 공통: 처리 기록 ──
  async function renderLog() {
    const txs = await getTransactions(name);
    if (txs.length === 0) return `<div class="empty-state"><div class="emoji">📋</div>처리 기록이 없어요</div>`;
    const typeIcon = {"주급":"💰","세금":"🏛️","칭찬쿠폰":"🌟","매점":"🛒","벌금":"⚠️","이벤트":"🎉","기타":"📝"};
    return `<div class="tx-list">${txs.map(tx => {
      const date = tx.createdAt?.toDate ? tx.createdAt.toDate().toLocaleDateString("ko-KR",{month:"numeric",day:"numeric",weekday:"short"}) : "";
      return `
        <div class="tx-item">
          <div class="tx-icon">${typeIcon[tx.type]||"📝"}</div>
          <div class="tx-desc"><div class="title">${tx.memo||tx.type}</div><div class="date">${date}</div></div>
          <div class="tx-amount ${tx.amount>0?"plus":"minus"}">${tx.amount>0?"+":""}${tx.amount.toLocaleString()}원</div>
        </div>`;
    }).join("")}</div>`;
  }

  // ── 이벤트 핸들러 연결 ──
  function attachHandlers(panelId) {
    // 지급처리
    const giveBtn = document.getElementById("give-btn");
    if (giveBtn) giveBtn.onclick = async () => {
      const target = document.getElementById("give-target").value;
      const type = document.getElementById("give-type").value;
      const amount = parseInt(document.getElementById("give-amount").value);
      const memo = document.getElementById("give-memo").value || type;
      if (!amount) return showToast("금액을 입력해주세요", true);
      const students = await getAllStudents();
      const targets = target === "__all__" ? students.map(s=>s.name) : [target];
      for (const n of targets) await addTransaction(n, amount, type, memo, name);
      showToast(`✅ ${targets.length}명 지급 완료!`);
    };

    // 세금 징수 버튼
    document.querySelectorAll(".tax-btn").forEach(btn => {
      btn.onclick = async () => {
        const n = btn.dataset.name;
        const tax = parseInt(btn.dataset.tax);
        btn.disabled = true;
        await addTransaction(n, -tax, "세금", "세금 납부", name);
        btn.textContent = "✅";
        btn.classList.remove("btn-gold");
        btn.classList.add("btn-outline");
        showToast(`${n} 세금 ${tax.toLocaleString()}원 징수 완료`);
      };
    });

    // 납부 처리
    document.querySelectorAll(".pay-fine-btn").forEach(btn => {
      btn.onclick = async () => {
        btn.disabled = true;
        await payFine(btn.dataset.fineid, btn.dataset.name, parseInt(btn.dataset.amount), name);
        showToast(`✅ ${btn.dataset.name} 납부 처리 완료!`);
        renderPanel("fine-manage");
      };
    });

    // 고지서 발행
    const fineIssueBtn = document.getElementById("fine-issue-btn");
    if (fineIssueBtn) fineIssueBtn.onclick = async () => {
      const target = document.getElementById("fine-target").value.trim();
      const amount = parseInt(document.getElementById("fine-amount").value);
      const reason = document.getElementById("fine-reason").value.trim();
      if (!target || !amount || !reason) return showToast("모두 입력해주세요", true);
      await issueFine(target, amount, reason, name);
      showToast(`✅ ${target}에게 고지서 발행!`);
      document.getElementById("fine-target").value = "";
      document.getElementById("fine-reason").value = "";
    };

    // 매점 열기/닫기
    const shopToggle = document.getElementById("shop-toggle-btn");
    if (shopToggle) shopToggle.onclick = async () => {
      const config = await getNationConfig();
      const { setNationConfig } = await import("../db.js");
      await setNationConfig({ shopOpen: !config?.shopOpen });
      showToast(`매점 ${!config?.shopOpen ? "오픈" : "마감"}!`);
      renderPanel("shop");
    };

    // 매점 판매
    const shopSell = document.getElementById("shop-sell-btn");
    if (shopSell) shopSell.onclick = async () => {
      const buyer = document.getElementById("shop-buyer").value.trim();
      const amount = parseInt(document.getElementById("shop-amount").value);
      const item = document.getElementById("shop-item").value.trim() || "매점 구매";
      if (!buyer || !amount) return showToast("구매자와 금액을 입력해주세요", true);
      await addTransaction(buyer, -amount, "매점", `매점: ${item}`, name);
      showToast(`✅ ${buyer} ${amount.toLocaleString()}원 차감 완료!`);
      document.getElementById("shop-buyer").value = "";
      document.getElementById("shop-item").value = "";
    };

    // 공지 등록
    const noticeSubmit = document.getElementById("notice-submit-btn");
    if (noticeSubmit) noticeSubmit.onclick = async () => {
      const title = document.getElementById("notice-title").value.trim();
      const content = document.getElementById("notice-content").value.trim();
      if (!title || !content) return showToast("제목과 내용을 입력해주세요", true);
      await addNotice(title, content, name);
      showToast("📢 공지가 등록됐어요!");
      document.getElementById("notice-title").value = "";
      document.getElementById("notice-content").value = "";
    };

    // 신고 상태 업데이트
    document.querySelectorAll(".report-update-btn").forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const sel = document.querySelector(`.report-status-sel[data-id="${id}"]`);
        await updateReport(id, sel.value, "", 0);
        showToast("✅ 상태 업데이트 완료!");
        renderPanel("report-manage");
      };
    });

    // 이벤트 보너스
    const eventBtn = document.getElementById("event-btn");
    if (eventBtn) eventBtn.onclick = async () => {
      const target = document.getElementById("event-target").value.trim();
      const amount = parseInt(document.getElementById("event-amount").value);
      const eventName = document.getElementById("event-name").value.trim() || "이벤트 보너스";
      if (!target || !amount) return showToast("대상과 금액을 입력해주세요", true);
      await addTransaction(target, amount, "이벤트", eventName, name);
      showToast(`🎉 ${target}에게 ${amount.toLocaleString()}원 지급!`);
      document.getElementById("event-target").value = "";
    };

    // 로또 뽑기
    const lotteryBtn = document.getElementById("lottery-btn");
    if (lotteryBtn) lotteryBtn.onclick = () => {
      const names = JSON.parse(lotteryBtn.dataset.names);
      if (names.length === 0) return showToast("학생 목록이 없어요", true);
      const resultEl = document.getElementById("lottery-result");
      const subEl = document.getElementById("lottery-sub");
      lotteryBtn.disabled = true;

      // 두근두근 애니메이션
      let count = 0;
      const interval = setInterval(() => {
        const random = names[Math.floor(Math.random() * names.length)];
        resultEl.textContent = random;
        count++;
        if (count > 20) {
          clearInterval(interval);
          const winner = names[Math.floor(Math.random() * names.length)];
          resultEl.textContent = "🎉 " + winner;
          subEl.textContent = "당첨자: " + winner + " — 아래에서 당첨금을 지급하세요!";
          document.getElementById("lottery-winner").value = winner;
          lotteryBtn.disabled = false;
        }
      }, 80);
    };

    // 로또 당첨금 지급
    const lotteryGive = document.getElementById("lottery-give-btn");
    if (lotteryGive) lotteryGive.onclick = async () => {
      const winner = document.getElementById("lottery-winner").value.trim();
      const prize = parseInt(document.getElementById("lottery-prize").value);
      if (!winner || !prize) return showToast("당첨자와 금액을 입력해주세요", true);
      await addTransaction(winner, prize, "이벤트", `로또 당첨금`, name);
      showToast(`🎉 ${winner}에게 ${prize.toLocaleString()}원 지급!`);
    };
  }

  window.doLogout = function() {
    clearSession();
    window.location.href = "login.html";
  };

  window.openStock = function() {
    if (window._stockKey) {
      window.open(`https://sub-teacher.com/API/stock/student.html?key=${window._stockKey}`, "_blank");
    } else {
      showToast("선생님께 반짝모의투자 등록을 부탁하세요 📈", true);
    }
  };

  function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2500);
  }

  init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마스터 대시보드 — 선영국가</title>
<link rel="stylesheet" href="../style.css">
<style>
.master-wrap { max-width: 860px; margin: 0 auto; padding: 16px; }

/* 요약 카드 */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin-bottom: 16px;
}
@media (max-width: 600px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-radius: 12px;
  padding: 14px; text-align: center;
}
.summary-card .s-icon { font-size: 22px; margin-bottom: 6px; }
.summary-card .s-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.summary-card .s-val {
  font-size: 20px; font-weight: 900;
  font-family: 'Gmarket Sans', sans-serif; color: var(--gold);
}

/* 학생 테이블 */
.student-table { width: 100%; border-collapse: collapse; }
.student-table th {
  background: var(--navy-mid); padding: 10px 12px;
  text-align: left; font-size: 12px; color: var(--text-dim);
  letter-spacing: 1px; border-bottom: 1px solid var(--navy-light);
}
.student-table td {
  padding: 10px 12px; font-size: 13px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.student-table tr:hover td { background: rgba(255,255,255,0.02); }

/* 공지 확인 현황 */
.notice-stat-item {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-radius: 12px;
  padding: 16px; margin-bottom: 10px;
}
.notice-stat-top {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 10px;
}
.notice-stat-title { font-size: 14px; font-weight: 700; }
.notice-stat-count { font-size: 13px; color: var(--accent3); font-weight: 700; }
.confirm-bar {
  background: var(--navy-mid); border-radius: 4px;
  height: 6px; margin-bottom: 10px; overflow: hidden;
}
.confirm-fill {
  height: 100%;
  background: linear-gradient(to right, var(--accent3), var(--accent));
  border-radius: 4px; transition: width 0.5s;
}
.confirm-names { display: flex; flex-wrap: wrap; gap: 6px; }
.confirm-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  background: rgba(105,240,174,0.1); color: var(--accent3);
  border: 1px solid rgba(105,240,174,0.2);
}
.unconfirm-chip {
  font-size: 11px; padding: 3px 8px; border-radius: 20px;
  background: rgba(255,107,107,0.1); color: var(--accent2);
  border: 1px solid rgba(255,107,107,0.2);
}

/* 신고 관리 */
.report-manage-item {
  background: var(--card);
  border: 1px solid var(--navy-light);
  border-radius: 12px;
  padding: 16px; margin-bottom: 10px;
}
.report-manage-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 8px;
}
.report-manage-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.report-manage-reporter { font-size: 12px; color: var(--accent2); }
.report-manage-desc {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.5; margin-bottom: 10px;
}
.report-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 설정 */
.setting-row {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--navy-light);
  gap: 12px;
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 14px; font-weight: 700; }
.setting-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.setting-input {
  background: var(--navy-mid); border: 1px solid var(--navy-light);
  border-radius: 8px; padding: 8px 12px; color: var(--text);
  font-size: 14px; font-family: 'Noto Sans KR', sans-serif;
  outline: none; width: 180px;
}
.setting-input:focus { border-color: var(--gold); }

/* 모달 */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.modal-box {
  background: var(--navy-mid);
  border: 1px solid var(--navy-light);
  border-radius: 16px;
  padding: 24px; width: 100%; max-width: 380px;
}
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="app-header">
  <div class="app-logo">👑 마스터 대시보드<span>담임 전용</span></div>
  <button class="btn btn-outline btn-sm" onclick="doLogout()">로그아웃</button>
</div>

<div class="master-wrap">
  <!-- 요약 -->
  <div class="summary-grid">
    <div class="summary-card"><div class="s-icon">👥</div><div class="s-label">전체 학생</div><div class="s-val" id="s-total">-</div></div>
    <div class="summary-card"><div class="s-icon">💰</div><div class="s-label">총 통화량</div><div class="s-val" id="s-money">-</div></div>
    <div class="summary-card"><div class="s-icon">🏛️</div><div class="s-label">미처리 신고</div><div class="s-val" id="s-report" style="color:var(--accent2)">-</div></div>
    <div class="summary-card"><div class="s-icon">📢</div><div class="s-label">미가입 학생</div><div class="s-val" id="s-unjoined" style="color:var(--text-dim)">-</div></div>
  </div>

  <!-- 탭 -->
  <div class="tab-bar" style="overflow-x:auto;">
    <button class="tab-btn active" onclick="switchTab('students', this)">👥 학생 관리</button>
    <button class="tab-btn" onclick="switchTab('notice', this)">📢 공지 관리</button>
    <button class="tab-btn" onclick="switchTab('report', this)">🚨 신고 관리</button>
    <button class="tab-btn" onclick="switchTab('money', this)">💸 가상화폐</button>
    <button class="tab-btn" onclick="switchTab('setting', this)">⚙️ 국가 설정</button>
  </div>

  <!-- 학생 관리 -->
  <div id="panel-students">
    <div class="spinner" id="students-spinner"></div>
    <div class="card" style="overflow-x:auto;">
      <table class="student-table" id="studentTable">
        <thead>
          <tr>
            <th>이름</th><th>역할</th><th>보유액</th><th>가입</th><th>주식키 · 관리</th>
          </tr>
        </thead>
        <tbody id="studentTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 공지 관리 -->
  <div id="panel-notice" style="display:none;">
    <div class="card" style="margin-bottom:14px;">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;">📢 새 공지 등록</div>
      <div class="input-group"><label>제목</label><input type="text" id="noticeTitle" placeholder="공지 제목"></div>
      <div class="input-group"><label>내용</label><textarea id="noticeContent" placeholder="공지 내용"></textarea></div>
      <button class="btn btn-gold" onclick="doAddNotice()">공지 등록하기</button>
    </div>
    <div class="spinner" id="notice-spinner"></div>
    <div id="noticeStatList"></div>
  </div>

  <!-- 신고 관리 -->
  <div id="panel-report" style="display:none;">
    <div class="spinner" id="report-spinner"></div>
    <div id="reportManageList"></div>
    <div class="empty-state" id="report-empty" style="display:none;">
      <div class="emoji">✅</div>접수된 신고가 없어요
    </div>
  </div>

  <!-- 가상화폐 지급/차감 -->
  <div id="panel-money" style="display:none;">
    <div class="card">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;">💸 가상화폐 지급 / 차감</div>
      <div class="input-group">
        <label>대상</label>
        <select id="moneyTarget">
          <option value="__all__">전체 학생</option>
        </select>
      </div>
      <div class="input-group"><label>금액 (원)</label><input type="number" id="moneyAmount" placeholder="예: 1000" step="500" min="0"></div>
      <div class="input-group"><label>유형</label>
        <select id="moneyType">
          <option value="주급">주급</option>
          <option value="칭찬쿠폰">칭찬쿠폰</option>
          <option value="세금">세금</option>
          <option value="벌금">벌금</option>
          <option value="이벤트">이벤트 보너스</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div class="input-group"><label>메모</label><input type="text" id="moneyMemo" placeholder="예: 5월 3주차 주급"></div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <button class="btn btn-gold" style="flex:1;" onclick="doMoney(1)">+ 지급</button>
        <button class="btn btn-danger" style="flex:1;" onclick="doMoney(-1)">− 차감</button>
      </div>
    </div>
  </div>

  <!-- 국가 설정 -->
  <div id="panel-setting" style="display:none;">
    <div class="card">
      <div class="setting-row">
        <div><div class="setting-label">국가 이름</div><div class="setting-desc">앱 상단에 표시됩니다</div></div>
        <input class="setting-input" type="text" id="set-name" placeholder="선영국가">
      </div>
      <div class="setting-row">
        <div><div class="setting-label">학급명</div><div class="setting-desc">예: 3학년 2반</div></div>
        <input class="setting-input" type="text" id="set-class" placeholder="3학년 X반">
      </div>
      <div class="setting-row">
        <div><div class="setting-label">마스터 비밀번호</div><div class="setting-desc">변경 시 입력 (빈칸 = 유지)</div></div>
        <input class="setting-input" type="password" id="set-pw" placeholder="새 비밀번호">
      </div>
      <div class="setting-row">
        <div><div class="setting-label">매점 운영 상태</div><div class="setting-desc">현재 매점 열림/닫힘</div></div>
        <select class="setting-input" id="set-shop" style="width:120px;">
          <option value="false">🔒 닫힘</option>
          <option value="true">🟢 열림</option>
        </select>
      </div>
      <button class="btn btn-gold" style="margin-top:16px;" onclick="doSaveSetting()">저장하기</button>
    </div>
  </div>
</div>

<!-- 비번 변경 모달 -->
<div class="modal-overlay" id="pwModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">🔑 비밀번호 변경</div>
    <div style="font-size:14px;font-weight:700;margin-bottom:12px;" id="pwModalName"></div>
    <div class="input-group">
      <label>새 비밀번호 (숫자 4자리)</label>
      <input type="password" id="newPw" maxlength="4" inputmode="numeric" placeholder="새 비밀번호">
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closePwModal()">취소</button>
      <button class="btn btn-gold" style="flex:1;" onclick="doChangePw()">변경하기</button>
    </div>
  </div>
</div>

<!-- 신고 처리 모달 -->
<div class="modal-overlay" id="reportModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">🚨 신고 처리</div>
    <input type="hidden" id="reportModalId">
    <div class="input-group">
      <label>처리 상태</label>
      <select id="reportModalStatus">
        <option value="접수됨">접수됨</option>
        <option value="조사중">조사중</option>
        <option value="처리완료">처리완료</option>
      </select>
    </div>
    <div class="input-group">
      <label>처리 결과 (공개됨)</label>
      <input type="text" id="reportModalResult" placeholder="예: 벌금 2,000원 부과">
    </div>
    <div class="input-group">
      <label>벌금 금액 (없으면 0)</label>
      <input type="number" id="reportModalFine" value="0" step="500">
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeReportModal()">취소</button>
      <button class="btn btn-gold" style="flex:1;" onclick="doUpdateReport()">저장하기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { requireMaster, clearSession } from "../auth.js";
  import {
    getAllStudents, getNationConfig, setNationConfig,
    changePassword, changeRole, addTransaction,
    getNotices, addNotice,
    getAllReports, updateReport,
    issueFine
  } from "../db.js";

  const session = requireMaster();
  if (!session) throw new Error("마스터 권한 필요");

  let allStudents = [];
  let allStudentNames = [];

  async function init() {
    const [students, config] = await Promise.all([getAllStudents(), getNationConfig()]);
    allStudents = students;
    allStudentNames = config?.studentNames || [];

    // 요약
    const totalMoney = students.reduce((s, st) => s + (st.balance || 0), 0);
    const reports = await getAllReports();
    const pending = reports.filter(r => r.status !== "처리완료").length;
    const joined = students.length;
    const unjoined = allStudentNames.length - joined;

    document.getElementById("s-total").textContent = allStudentNames.length + "명";
    document.getElementById("s-money").textContent = totalMoney.toLocaleString();
    document.getElementById("s-report").textContent = pending + "건";
    document.getElementById("s-unjoined").textContent = unjoined + "명";

    // 설정값 채우기
    document.getElementById("set-name").value = config?.name || "";
    document.getElementById("set-class").value = config?.className || "";
    document.getElementById("set-shop").value = String(config?.shopOpen || false);

    loadStudents();
    loadMoneyTargets();
  }

  function loadStudents() {
    document.getElementById("students-spinner").style.display = "none";
    const joinedMap = {};
    allStudents.forEach(s => joinedMap[s.name] = s);

    const roleColors = {
      "국민":"badge-blue", "은행원":"badge-gold", "세금징수원":"badge-gold",
      "매점지기":"badge-gold", "주식중개인":"badge-gold", "검사":"badge-gold",
      "기자":"badge-gold", "청소원":"badge-gold", "국회의장":"badge-gold", "감찰관":"badge-gold"
    };

    const rows = allStudentNames.map(name => {
      const s = joinedMap[name];
      const joined = !!s;
      const role = s?.role || "미가입";
      const balance = s?.balance || 0;
      const stockKey = s?.stockKey || "";
      return `
        <tr>
          <td style="font-weight:700;">${name}</td>
          <td>
            <select onchange="doChangeRole('${name}', this.value)" style="background:var(--navy-mid);border:1px solid var(--navy-light);border-radius:6px;padding:4px 8px;color:var(--text);font-size:12px;font-family:'Noto Sans KR',sans-serif;">
              ${["국민","은행원","세금징수원","매점지기","주식중개인","검사","기자","청소원","국회의장","감찰관"].map(r =>
                `<option value="${r}" ${role===r?"selected":""}>${r}</option>`
              ).join("")}
            </select>
          </td>
          <td style="font-family:'Gmarket Sans';color:var(--gold);">${balance.toLocaleString()}원</td>
          <td>${joined ? `<span class="badge badge-green">가입</span>` : `<span class="badge badge-red">미가입</span>`}</td>
          <td style="display:flex;gap:6px;align-items:center;">
            <input type="text" value="${stockKey}" placeholder="주식키 입력"
              style="background:var(--navy-mid);border:1px solid var(--navy-light);border-radius:6px;padding:4px 8px;color:var(--text);font-size:12px;width:110px;font-family:'Noto Sans KR',sans-serif;"
              id="stockkey-${name}">
            <button class="btn btn-gold btn-sm" onclick="doSaveStockKey('${name}')">저장</button>
            <button class="btn btn-outline btn-sm" onclick="openPwModal('${name}')">비번</button>
          </td>
        </tr>`;
    }).join("");

    document.getElementById("studentTbody").innerHTML = rows;
  }

  function loadMoneyTargets() {
    const sel = document.getElementById("moneyTarget");
    const existing = allStudentNames.map(n => `<option value="${n}">${n}</option>`).join("");
    sel.innerHTML = `<option value="__all__">전체 학생</option>` + existing;
  }

  // 공지 탭
  async function loadNotices() {
    document.getElementById("notice-spinner").style.display = "block";
    const notices = await getNotices();
    document.getElementById("notice-spinner").style.display = "none";

    if (notices.length === 0) {
      document.getElementById("noticeStatList").innerHTML = `<div class="empty-state"><div class="emoji">📢</div>등록된 공지가 없어요</div>`;
      return;
    }

    const total = allStudentNames.length;
    document.getElementById("noticeStatList").innerHTML = notices.map(n => {
      const confirmed = n.confirmedBy || [];
      const pct = total > 0 ? Math.round(confirmed.length / total * 100) : 0;
      const unconfirmed = allStudentNames.filter(name => !confirmed.includes(name));
      return `
        <div class="notice-stat-item">
          <div class="notice-stat-top">
            <div class="notice-stat-title">${n.title}</div>
            <div class="notice-stat-count">${confirmed.length} / ${total}명 확인</div>
          </div>
          <div class="confirm-bar"><div class="confirm-fill" style="width:${pct}%"></div></div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">✅ 확인한 학생</div>
          <div class="confirm-names" style="margin-bottom:10px;">
            ${confirmed.length > 0 ? confirmed.map(n => `<span class="confirm-chip">${n}</span>`).join("") : "<span style='font-size:12px;color:var(--text-dim)'>없음</span>"}
          </div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">❌ 미확인 학생</div>
          <div class="confirm-names">
            ${unconfirmed.length > 0 ? unconfirmed.map(n => `<span class="unconfirm-chip">${n}</span>`).join("") : "<span style='font-size:12px;color:var(--accent3)'>전원 확인 ✅</span>"}
          </div>
        </div>`;
    }).join("");
  }

  window.doAddNotice = async function() {
    const title = document.getElementById("noticeTitle").value.trim();
    const content = document.getElementById("noticeContent").value.trim();
    if (!title || !content) return showToast("제목과 내용을 입력해주세요", true);
    await addNotice(title, content, "담임");
    showToast("📢 공지가 등록됐어요!");
    document.getElementById("noticeTitle").value = "";
    document.getElementById("noticeContent").value = "";
    loadNotices();
  };

  // 신고 탭
  async function loadReports() {
    document.getElementById("report-spinner").style.display = "block";
    const reports = await getAllReports();
    document.getElementById("report-spinner").style.display = "none";

    if (reports.length === 0) {
      document.getElementById("report-empty").style.display = "block";
      return;
    }

    const statusBadge = {
      "접수됨": `<span class="badge badge-gold">접수됨</span>`,
      "조사중": `<span class="badge badge-blue">조사중</span>`,
      "처리완료": `<span class="badge badge-green">처리완료</span>`,
    };

    document.getElementById("reportManageList").innerHTML = reports.map(r => {
      const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString("ko-KR", { month:"numeric", day:"numeric" }) : "";
      return `
        <div class="report-manage-item">
          <div class="report-manage-top">
            <div>
              <div class="report-manage-title">${r.type}</div>
              <div class="report-manage-reporter">신고자: ${r.reporterName} · ${date}</div>
            </div>
            ${statusBadge[r.status] || r.status}
          </div>
          <div class="report-manage-desc">${r.content}</div>
          ${r.result ? `<div style="font-size:12px;color:var(--accent3);margin-bottom:8px;">처리결과: ${r.result}</div>` : ""}
          <div class="report-actions">
            <button class="btn btn-outline btn-sm" onclick="openReportModal('${r.id}','${r.status}','${r.result||""}',${r.fine||0})">상태 변경</button>
            <button class="btn btn-danger btn-sm" onclick="openFineModal('${r.reporterName}')">고지서 발행</button>
          </div>
        </div>`;
    }).join("");
  }

  // 가상화폐 지급/차감
  window.doMoney = async function(sign) {
    const target = document.getElementById("moneyTarget").value;
    const amount = parseInt(document.getElementById("moneyAmount").value);
    const type = document.getElementById("moneyType").value;
    const memo = document.getElementById("moneyMemo").value.trim() || type;

    if (!amount || amount <= 0) return showToast("금액을 입력해주세요", true);

    const targets = target === "__all__" ? allStudents.map(s => s.name) : [target];
    for (const name of targets) {
      await addTransaction(name, sign * amount, type, memo, "마스터");
    }
    showToast(`✅ ${targets.length}명 ${sign > 0 ? "지급" : "차감"} 완료!`);
    init();
  };

  // 설정 저장
  window.doSaveSetting = async function() {
    const name = document.getElementById("set-name").value.trim();
    const className = document.getElementById("set-class").value.trim();
    const pw = document.getElementById("set-pw").value.trim();
    const shopOpen = document.getElementById("set-shop").value === "true";

    const data = { name, className, shopOpen };
    if (pw) data.masterPassword = pw;

    await setNationConfig(data);
    showToast("✅ 설정이 저장됐어요!");
    document.getElementById("set-pw").value = "";
  };

  // 주식키 저장
  window.doSaveStockKey = async function(name) {
    const key = document.getElementById(`stockkey-${name}`).value.trim();
    const { doc, updateDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const { db } = await import("../firebase.js");
    await updateDoc(doc(db, "students", name), { stockKey: key });
    showToast(`✅ ${name} 주식키 저장 완료!`);
  };

  // 역할 변경
  window.doChangeRole = async function(name, role) {
    await changeRole(name, role);
    showToast(`✅ ${name} → ${role}`);
  };

  // 비번 변경 모달
  window.openPwModal = function(name) {
    document.getElementById("pwModalName").textContent = name;
    document.getElementById("newPw").value = "";
    document.getElementById("pwModal").style.display = "flex";
  };
  window.closePwModal = function() {
    document.getElementById("pwModal").style.display = "none";
  };
  window.doChangePw = async function() {
    const name = document.getElementById("pwModalName").textContent;
    const pw = document.getElementById("newPw").value.trim();
    if (pw.length !== 4 || !/^\d{4}$/.test(pw)) return showToast("숫자 4자리를 입력해주세요", true);
    await changePassword(name, pw);
    showToast(`✅ ${name} 비밀번호 변경 완료!`);
    closePwModal();
  };

  // 신고 처리 모달
  window.openReportModal = function(id, status, result, fine) {
    document.getElementById("reportModalId").value = id;
    document.getElementById("reportModalStatus").value = status;
    document.getElementById("reportModalResult").value = result;
    document.getElementById("reportModalFine").value = fine;
    document.getElementById("reportModal").style.display = "flex";
  };
  window.closeReportModal = function() {
    document.getElementById("reportModal").style.display = "none";
  };
  window.doUpdateReport = async function() {
    const id = document.getElementById("reportModalId").value;
    const status = document.getElementById("reportModalStatus").value;
    const result = document.getElementById("reportModalResult").value;
    const fine = parseInt(document.getElementById("reportModalFine").value) || 0;
    await updateReport(id, status, result, fine);
    showToast("✅ 신고 처리 완료!");
    closeReportModal();
    loadReports();
  };

  // 고지서 발행 (신고에서)
  window.openFineModal = function(targetName) {
    const target = prompt(`고지서 대상 이름 확인:\n${targetName}\n\n맞으면 확인, 다르면 이름 수정:`);
    if (!target) return;
    const amount = parseInt(prompt("벌금 금액 (원):"));
    if (!amount) return;
    const reason = prompt("벌금 사유:");
    if (!reason) return;
    issueFine(target, amount, reason, "마스터").then(() => showToast(`✅ ${target}에게 고지서 발행!`));
  };

  // 탭 전환
  window.switchTab = function(tab, btn) {
    document.querySelectorAll(".tab-btn").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    ["students","notice","report","money","setting"].forEach(t => {
      document.getElementById("panel-" + t).style.display = t === tab ? "block" : "none";
    });
    if (tab === "notice") loadNotices();
    if (tab === "report") loadReports();
  };

  window.doLogout = function() {
    clearSession();
    window.location.href = "login.html";
  };

  function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2500);
  }

  init();
</script>
</body>
</html>
